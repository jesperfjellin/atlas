[project]
name = "atlas"
version = "0.1.0"
description = "A small learning experiment on changes in OpenStreetMap"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "h3>=4.5.0",
    "lightgbm==4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "osmium>=4.3.1",
    "pyarrow>=25.0.1",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "shapely>=2.1.2",
    "torch>=2.14.0",
    "triton-rocm>=3.8.0,<3.9",
]

[project.scripts]
atlas = "atlas.cli:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }

[tool.uv]
no-binary-package = ["lightgbm"]

[tool.uv.config-settings-package.lightgbm]
"cmake.define.USE_GPU" = "ON"
"build.tool-args" = "-j4"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]
